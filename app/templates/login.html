<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Anem Parc</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <img src="{{ url_for('static', filename='anemlogo.png') }}" alt="Logo Anem" class="brand-logo">
      <h1>Anem Parc</h1>
      <p>Gestion du parc informatique</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('auth.login') }}" class="login-form">
      <label for="email">Adresse email</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="username">

      <label for="mot_de_passe">Mot de passe</label>
      <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password">

      <button type="submit">Se connecter</button>
    </form>

    <p class="login-hint">Identifiants par défaut : admin@anem.dz / admin</p>
  </main>
</body>
</html>
